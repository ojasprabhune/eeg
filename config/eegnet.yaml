# eegnet (raw EEG epoch -> 1 of 4 classes, PhysioNet imagined movement, Wang et al. 2020)

experiment: physionet_imagined
input_type: raw # EEGNet expects "raw" (64 ch x 480 samples)
skip_preprocessing: true # must match the saved dataset (see meta.json)

vocab_size: 4
num_channels: 64
num_samples: 480
dropout: 0.2
kern_length: 128
f1: 8
f2: 16
d: 2

# training

k: 5 # number of subject folds. 1 = single 80/20 run, no folding
num_epochs: -1
device: cpu
batch_size: 16
base_lr: 0.01
epochs: 100

use_ckpt_path: null
save_ckpt_path: /Users/ojasprabhune/Documents/research/NORA/ckpts/eegnet/eegnet
save_every: 50
