# gesture model (EEG epoch -> gesture class, encoder + decoder query)

experiment: common_8_letters
input_type: raw # "raw" (14 ch), "bandpower" (84 feat), "csp" (6 feat), or "dwt" (84 feat) - used when running this file directly

vocab_size: 4
num_channels: 64
num_samples: 480
dropout: 0.2
kern_length: 128
f1: 8
f2: 16
d: 2

# training

num_epochs: -1
device: cpu
batch_size: 16
warmup_steps: -1
base_lr: 0.01
epochs: 100

use_ckpt_path: null
save_ckpt_path: null
# save_ckpt_path: /Users/ojasprabhune/Documents/research/NORA/ckpts/gesture/gesture_model
save_every: 50
