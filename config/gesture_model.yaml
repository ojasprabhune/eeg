# gesture model (EEG epoch -> gesture class, encoder + decoder query)

experiment: common_8_letters # own data only (scripts/eeg/self), physionet ignores this
input_type: bandpower # "raw", "bandpower", "csp", or "dwt" - used when running this file directly
skip_preprocessing: true # physionet only, must match the saved dataset (see meta.json)

num_layers: 2
decoder_num_layers: 2
num_heads: 2
embedding_dim: 4
ffn_hidden_dim: 4
encoder_dropout: 0.1
decoder_dropout: 0.1

# training

num_recordings: 3
k: 1 # number of folds. 1 = single run, no folding
device: cpu
batch_size: 32
warmup_steps: 500
base_lr: 5e-4
epochs: 500

use_ckpt_path: null
save_ckpt_path: null
# save_ckpt_path: /Users/ojasprabhune/Documents/research/NORA/ckpts/gesture/gesture_model
save_every: 50
