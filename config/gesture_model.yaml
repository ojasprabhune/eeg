# gesture model (EEG epoch -> gesture class, encoder + decoder query)

experiment: common_8_letters
input_type: raw # "raw" (14 ch), "bandpower" (84 feat), "csp" (6 feat), or "dwt" (84 feat) - used when running this file directly
k: 5 # number of cross-validation folds

num_layers: 2
decoder_num_layers: 2
num_heads: 2
embedding_dim: 4
ffn_hidden_dim: 4
encoder_dropout: 0.1
decoder_dropout: 0.1

# training

num_recordings: 3
device: cpu
batch_size: 8
warmup_steps: 500
base_lr: 5e-4
epochs: 500

use_ckpt_path: null
save_ckpt_path: null
# save_ckpt_path: /Users/ojasprabhune/Documents/research/NORA/ckpts/gesture/gesture_model
save_every: 50
